name: webui_5700
description: NetBox 5700 - 5G模块管理与网络诊断工具箱（AT控制台/网络检测/NAT诊断/带宽测试）
publish_to: 'none'
version: 1.0.6+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理和路由
  get: ^4.6.6
  
  # WebSocket通信
  web_socket_channel: ^2.4.0
  
  # WebSocket服务器
  shelf: ^1.4.1
  shelf_web_socket: ^1.0.4
  shelf_static: ^1.1.2
  mime: ^1.0.4
  
  # WebView
  webview_flutter: ^4.4.2
  
  # 本地存储
  shared_preferences: ^2.2.2
  
  # URL启动器
  url_launcher: ^6.2.2
  
  # UI相关
  flutter_screenutil: ^5.9.0
  cupertino_icons: ^1.0.6
  flex_color_scheme: ^8.0.0
  
  # 图表
  fl_chart: ^0.66.0
  
  # 时间格式化
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/web/
    - assets/web/at/
    - assets/web/icons/
    - assets/web/network/
    - assets/web/network/dial/
    - assets/web/network/info/
    - assets/web/network/setting/
    - assets/web/scripts/
    - assets/web/sms/
    - assets/web/sms/center/
    - assets/web/sms/settings/
    - assets/web/system/
    - assets/web/system/info/
    - assets/web/system/upgrade/
  
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: fonts/CustomFont-Regular.ttf

